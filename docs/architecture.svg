<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Private Anyscale-ready AKS on Azure</title>
  <desc id="desc">Architecture diagram for the AKS Anyscale private cluster sample. It shows Bastion-first control-plane access, a private AKS API, Azure Firewall-managed egress, private endpoints for ADLS Gen2 and ACR, Azure DNS Private Resolver, the Anyscale SaaS control plane outside the workload VNet, and an optional Azure VPN Gateway Point-to-Site path for local console and private session browser testing.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#10b981"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#14b8a6"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <style>
      .page { fill: #ffffff; }
      .title { font: 700 28px Inter, Segoe UI, Arial, sans-serif; fill: #111827; }
      .subtitle { font: 15px Inter, Segoe UI, Arial, sans-serif; fill: #4b5563; }
      .label { font: 700 16px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .panel-title { font: 700 15px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .panel-copy { font: 12px Inter, Segoe UI, Arial, sans-serif; fill: #64748b; }
      .subnet-label { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #1e40af; }
      .subnet-orange-label { font: 600 12px Inter, Segoe UI, Arial, sans-serif; fill: #9a3412; }
      .card-title { font: 600 13px Inter, Segoe UI, Arial, sans-serif; fill: #111827; }
      .card-copy { font: 12px Inter, Segoe UI, Arial, sans-serif; fill: #374151; }
      .card-copy-strong { font: 12px Inter, Segoe UI, Arial, sans-serif; fill: #065f46; }
      .note { font: 12px Inter, Segoe UI, Arial, sans-serif; fill: #334155; }
      .rg { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 8 5; }
      .vnet { fill: #eff6ff; stroke: #60a5fa; stroke-width: 1.5; }
      .panel { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.3; }
      .subnet { fill: #f8fbff; stroke: #93c5fd; stroke-width: 1.2; }
      .subnet-orange { fill: #fff7ed; stroke: #fcd34d; stroke-width: 1.2; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .card-blue { stroke: #2563eb; }
      .card-green { stroke: #10b981; }
      .card-orange { stroke: #f59e0b; }
      .card-purple { stroke: #a855f7; }
      .card-teal { stroke: #14b8a6; }
      .banner { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.2; }
      .line-blue { stroke: #2563eb; stroke-width: 2.5; fill: none; marker-end: url(#arrow-blue); }
      .line-blue-dash { stroke: #2563eb; stroke-width: 2.5; stroke-dasharray: 8 5; fill: none; marker-end: url(#arrow-blue); }
      .line-green { stroke: #10b981; stroke-width: 2.5; fill: none; marker-end: url(#arrow-green); }
      .line-green-dash { stroke: #10b981; stroke-width: 2.5; stroke-dasharray: 8 5; fill: none; marker-end: url(#arrow-green); }
      .line-orange { stroke: #f59e0b; stroke-width: 2.5; fill: none; marker-end: url(#arrow-orange); }
      .line-teal-dash { stroke: #14b8a6; stroke-width: 2.5; stroke-dasharray: 8 5; fill: none; marker-end: url(#arrow-teal); }
      .line-slate-dash { stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 6 4; fill: none; marker-end: url(#arrow-slate); }
      .edge-label { font: 11px Inter, Segoe UI, Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge-label-blue { font: 11px Inter, Segoe UI, Arial, sans-serif; fill: #1d4ed8; text-anchor: middle; }
      .edge-label-teal { font: 11px Inter, Segoe UI, Arial, sans-serif; fill: #0f766e; text-anchor: middle; }
      .edge-label-bg { fill: #ffffff; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect class="page" x="0" y="0" width="1800" height="1040"/>

  <text class="title" x="40" y="58">Private Anyscale-ready AKS on Azure</text>
  <text class="subtitle" x="40" y="92">
    <tspan x="40" dy="0">Bastion-first control-plane access, private AKS API, private endpoints for ADLS Gen2 and ACR, and an optional Azure VPN Gateway P2S path for local console and browser testing.</tspan>
    <tspan x="40" dy="22">Azure-native Anyscale platform resources, Firewall-managed egress, identity, and observability remain outside the workload VNet.</tspan>
  </text>

  <rect class="rg" x="180" y="140" width="1560" height="760" rx="12" ry="12"/>
  <text class="label" x="200" y="166">Resource group: rg-myproject-dev-wus3</text>

  <rect class="vnet" x="240" y="210" width="1080" height="620" rx="12" ry="12"/>
  <text class="label" x="258" y="236">Virtual network: vnet-myproject-dev-wus3 | 10.50.0.0/16</text>

  <rect class="panel" x="1360" y="210" width="340" height="620" rx="12" ry="12"/>
  <text class="panel-title" x="1385" y="238">Global platform and control services (outside VNet)</text>
  <text class="panel-copy" x="1385" y="264">
    <tspan x="1385" dy="0">The Anyscale control plane, Azure resource model,</tspan>
    <tspan x="1385" dy="18">identity surface, egress policy, and observability</tspan>
    <tspan x="1385" dy="18">stay outside the workload VNet.</tspan>
  </text>

  <path class="line-blue" d="M180 480 L225 480 L225 330 L310 330"/>
  <path class="line-blue" d="M470 330 L570 330"/>
  <path class="line-blue" d="M650 365 L650 520 L750 520 L750 560"/>
  <path class="line-slate-dash" d="M180 445 L220 445 L220 346 L1390 346"/>
  <path class="line-teal-dash" d="M180 500 L220 500 L220 330 L825 330"/>
  <path class="line-teal-dash" d="M995 326 L1010 326 L1010 686 L930 686"/>
  <path class="line-green-dash" d="M490 510 L520 510 L700 430 L1090 430 L1090 308"/>
  <path class="line-green" d="M930 607 L1030 607 L1030 308 L1090 308"/>
  <path class="line-orange" d="M930 607 L980 607 L1060 592 L1090 592"/>
  <path class="line-orange" d="M1250 592 L1320 592 L1320 656 L1390 656"/>
  <path class="line-blue-dash" d="M1390 446 L1335 446 L1335 607 L930 607"/>

  <rect class="edge-label-bg" x="722" y="334" width="116" height="18" rx="4" ry="4"/>
  <text class="edge-label" x="780" y="347">browser auth + API</text>

  <rect class="edge-label-bg" x="454" y="314" width="102" height="18" rx="4" ry="4"/>
  <text class="edge-label-teal" x="505" y="327">optional P2S</text>

  <rect class="edge-label-bg" x="1005" y="548" width="150" height="18" rx="4" ry="4"/>
  <text class="edge-label-teal" x="1080" y="561">private session hostnames</text>

  <rect class="edge-label-bg" x="1110" y="430" width="120" height="18" rx="4" ry="4"/>
  <text class="edge-label-blue" x="1170" y="443">cloud + extension</text>

  <rect class="card" x="30" y="420" width="150" height="120" rx="10" ry="10"/>
  <text class="card-title center" x="105" y="450">Admin workstation</text>
  <text class="card-copy center" x="105" y="473">
    <tspan x="105" dy="0">Azure CLI + Terraform</tspan>
    <tspan x="105" dy="18">Anyscale CLI / kubectl</tspan>
    <tspan x="105" dy="18">Browser + OpenVPN client</tspan>
  </text>

  <rect class="subnet" x="280" y="250" width="220" height="150" rx="10" ry="10"/>
  <text class="subnet-label" x="294" y="270">
    <tspan x="294" dy="0">AzureBastionSubnet</tspan>
    <tspan x="294" dy="18">10.50.0.128/26</tspan>
  </text>
  <rect class="card card-blue" x="310" y="295" width="160" height="70" rx="10" ry="10"/>
  <text class="card-title" x="328" y="322">Azure Bastion Standard</text>
  <text class="card-copy" x="328" y="342">Native client tunnel</text>

  <rect class="subnet" x="540" y="250" width="220" height="150" rx="10" ry="10"/>
  <text class="subnet-label" x="554" y="270">
    <tspan x="554" dy="0">AKS API server subnet</tspan>
    <tspan x="554" dy="18">10.50.1.0/28</tspan>
  </text>
  <rect class="card card-blue" x="570" y="295" width="160" height="70" rx="10" ry="10"/>
  <text class="card-title" x="588" y="322">Private AKS API</text>
  <text class="card-copy" x="588" y="342">No public endpoint</text>

  <rect class="subnet" x="800" y="250" width="220" height="150" rx="10" ry="10"/>
  <text class="subnet-label" x="814" y="270">
    <tspan x="814" dy="0">GatewaySubnet</tspan>
    <tspan x="814" dy="18">10.50.1.64/27</tspan>
  </text>
  <rect class="card card-teal" x="825" y="282" width="170" height="88" rx="10" ry="10"/>
  <text class="card-title" x="841" y="308">Azure VPN Gateway</text>
  <text class="card-copy" x="841" y="328">
    <tspan x="841" dy="0">P2S OpenVPN + cert auth</tspan>
    <tspan x="841" dy="18">Client DNS via resolver inbound</tspan>
  </text>

  <rect class="subnet" x="1060" y="230" width="220" height="260" rx="10" ry="10"/>
  <text class="subnet-label" x="1074" y="250">
    <tspan x="1074" dy="0">Private endpoint subnet</tspan>
    <tspan x="1074" dy="18">10.50.2.0/24</tspan>
  </text>
  <rect class="card card-green" x="1090" y="278" width="160" height="60" rx="10" ry="10"/>
  <text class="card-title" x="1108" y="303">Private endpoint hub</text>
  <text class="card-copy" x="1108" y="322">Blob + DFS + ACR</text>
  <rect class="card card-green" x="1090" y="353" width="160" height="54" rx="10" ry="10"/>
  <text class="card-title" x="1108" y="377">ADLS Gen2 storage</text>
  <text class="card-copy" x="1108" y="394">Private endpoint only</text>
  <rect class="card card-green" x="1090" y="418" width="160" height="54" rx="10" ry="10"/>
  <text class="card-title" x="1108" y="442">Azure Container Registry</text>
  <text class="card-copy" x="1108" y="459">Premium + private link</text>

  <rect class="subnet" x="280" y="430" width="220" height="150" rx="10" ry="10"/>
  <text class="subnet-label" x="294" y="450">
    <tspan x="294" dy="0">DNS resolver subnets</tspan>
    <tspan x="294" dy="18">10.50.1.16/28 and 10.50.1.32/28</tspan>
  </text>
  <rect class="card card-blue" x="300" y="470" width="190" height="80" rx="10" ry="10"/>
  <text class="card-title" x="318" y="495">DNS Private Resolver</text>
  <text class="card-copy" x="318" y="515">
    <tspan x="318" dy="0">Hybrid forwarding</tspan>
    <tspan x="318" dy="18">Private Link zones</tspan>
  </text>

  <rect class="subnet" x="540" y="510" width="420" height="200" rx="10" ry="10"/>
  <text class="subnet-label" x="554" y="530">
    <tspan x="554" dy="0">AKS node subnet</tspan>
    <tspan x="554" dy="18">10.50.4.0/22</tspan>
  </text>
  <rect class="card card-blue" x="570" y="560" width="360" height="94" rx="10" ry="10"/>
  <text class="card-title" x="588" y="588">Private AKS cluster</text>
  <text class="card-copy" x="588" y="608">
    <tspan x="588" dy="0">OIDC + workload identity</tspan>
    <tspan x="588" dy="18">System, CPU, and GPU pools</tspan>
  </text>
  <rect class="banner" x="570" y="660" width="360" height="44" rx="10" ry="10"/>
  <text class="card-copy-strong center" x="750" y="680">
    <tspan x="750" dy="0">ingress-nginx + NVIDIA plugin</tspan>
    <tspan x="750" dy="18">private session hostnames + private frontend IP</tspan>
  </text>

  <rect class="subnet-orange" x="1060" y="520" width="220" height="150" rx="10" ry="10"/>
  <text class="subnet-orange-label" x="1074" y="540">
    <tspan x="1074" dy="0">Azure Firewall subnet</tspan>
    <tspan x="1074" dy="18">10.50.0.0/26</tspan>
  </text>
  <rect class="card card-orange" x="1090" y="557" width="160" height="70" rx="10" ry="10"/>
  <text class="card-title" x="1108" y="582">Azure Firewall</text>
  <text class="card-copy" x="1108" y="602">DNS proxy + egress</text>

  <rect class="card card-blue" x="1390" y="305" width="280" height="82" rx="10" ry="10"/>
  <text class="card-title" x="1408" y="330">Anyscale console</text>
  <text class="card-copy" x="1408" y="350">
    <tspan x="1408" dy="0">SaaS control plane</tspan>
    <tspan x="1408" dy="18">Browser auth + cluster_auth</tspan>
  </text>

  <rect class="card card-blue" x="1390" y="405" width="280" height="82" rx="10" ry="10"/>
  <text class="card-title" x="1408" y="430">Anyscale platform</text>
  <text class="card-copy" x="1408" y="450">
    <tspan x="1408" dy="0">Azure cloud resource + AKS extension</tspan>
    <tspan x="1408" dy="18">ARM / AzAPI deployment</tspan>
  </text>

  <rect class="card card-purple" x="1390" y="505" width="280" height="82" rx="10" ry="10"/>
  <text class="card-title" x="1408" y="530">Operator UAMI</text>
  <text class="card-copy" x="1408" y="550">
    <tspan x="1408" dy="0">Federated identity</tspan>
    <tspan x="1408" dy="18">Storage access + platform auth</tspan>
  </text>

  <rect class="card card-orange" x="1390" y="610" width="280" height="92" rx="10" ry="10"/>
  <text class="card-title" x="1408" y="636">Firewall policy / egress</text>
  <text class="card-copy" x="1408" y="656">
    <tspan x="1408" dy="0">Anyscale, marketplace, AKS, and Monitor</tspan>
    <tspan x="1408" dy="18">NVIDIA and registry FQDNs</tspan>
  </text>

  <rect class="card card-teal" x="1390" y="725" width="280" height="82" rx="10" ry="10"/>
  <text class="card-title" x="1408" y="750">Log Analytics + AMPLS</text>
  <text class="card-copy" x="1408" y="770">
    <tspan x="1408" dy="0">Container Insights</tspan>
    <tspan x="1408" dy="18">Diagnostics and observability</tspan>
  </text>

  <text class="note" x="40" y="950">
    <tspan x="40" dy="0">Control-plane admin traffic uses Bastion. Optional P2S client traffic uses the Azure VPN Gateway and DNS Private Resolver inbound endpoint so the local browser can reach private Anyscale session hostnames for console and workspace testing.</tspan>
  </text>
</svg>
